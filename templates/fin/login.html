{% extends "base.html" %}
{% block title %}Financeiro — Entrar{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h4 class="mb-3"><i class="bi bi-bank me-2"></i>Financeiro</h4>
    <form method="POST">
      <div class="mb-3"><label class="form-label">Login</label><input name="login" class="form-control" autofocus required></div>
      <div class="mb-3"><label class="form-label">Senha</label><input name="senha" type="password" class="form-control" required></div>
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
