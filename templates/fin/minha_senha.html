{% extends "base.html" %}
{% block title %}Trocar senha{% endblock %}
{% block content %}
{% include 'fin/_topo.html' %}
<div class="row"><div class="col-md-4">
  <h4 class="mb-3">Trocar minha senha</h4>
  <form method="POST" class="card card-body">
    <div class="mb-2"><label class="form-label small">Senha atual</label><input name="atual" type="password" class="form-control" required></div>
    <div class="mb-2"><label class="form-label small">Nova senha</label><input name="senha" type="password" class="form-control" required></div>
    <div class="mb-3"><label class="form-label small">Repita a nova senha</label><input name="senha2" type="password" class="form-control" required></div>
    <button class="btn btn-primary">Salvar</button>
  </form>
</div></div>
{% endblock %}
